# GitHub Actions gate. Hosted runners only (ubuntu, windows, macos); no secrets; the token is
# read-only. A fork's pull request therefore runs the same checks safely.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -yq libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The CLI reference is generated; fail if the committed copy is stale. This also checks that
      # every book page is in the zensical.toml navigation or excluded.
      - run: cargo xtask docs --check
      # Every file needs an SPDX header or a REUSE.toml annotation.
      - run: cargo xtask reuse-check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: release-notes generator tests
        run: python3 -m unittest discover -s packaging
      # Every `valerian ...` command in the book must exist in the CLI reference.
      - name: book commands match the CLI reference
        run: python3 scripts/check_book_commands.py
      - name: build the book (strict, so broken links and images fail)
        run: |
          pip install -r docs/requirements.txt
          zensical build --strict --clean

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, gpu: software }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, gpu: software }
          - { os: macos-15, target: aarch64-apple-darwin, gpu: none }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: lavapipe (Linux software Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      # Windows uses WARP (DX12 software adapter), which ships with the OS. The macOS hosted runner has
      # no software adapter, and a set VALERIAN_GPU_TESTS makes a missing adapter fatal, so the 'none'
      # target leaves it unset and the GPU tests skip.
      - name: test (software GPU adapter)
        if: matrix.gpu != 'none'
        run: cargo test --workspace --all-features --target ${{ matrix.target }}
        env:
          VALERIAN_GPU_TESTS: ${{ matrix.gpu }}
      - name: test (no GPU tests)
        if: matrix.gpu == 'none'
        run: cargo test --workspace --all-features --target ${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version
        id: msrv
        run: echo "v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - run: sudo apt-get update -q && sudo apt-get install -yq libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo check --workspace --all-targets --all-features
