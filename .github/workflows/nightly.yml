# The extra targets run here, not on every push, to keep the push CI fast.
name: nightly
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test-extra:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, gpu: software }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, gpu: software }
          - { os: macos-15-intel, target: x86_64-apple-darwin, gpu: none }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      # A set VALERIAN_GPU_TESTS makes a missing adapter fatal, so the 'none' target leaves it unset.
      - name: test (software GPU adapter)
        if: matrix.gpu != 'none'
        run: cargo test --workspace --all-features --target ${{ matrix.target }}
        env:
          VALERIAN_GPU_TESTS: ${{ matrix.gpu }}
      - name: test (no GPU tests)
        if: matrix.gpu == 'none'
        run: cargo test --workspace --all-features --target ${{ matrix.target }}
