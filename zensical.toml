# Zensical (zensical.org) builds the documentation site from docs/book/src.
# Build: `zensical build --clean` (version pinned in docs/requirements.txt).
# The navigation below replaces the old mdBook SUMMARY.md. Every page under
# docs/book/src must be in `nav` or in `exclude_docs`: `cargo xtask docs --check` checks it.
[project]
site_name = "Valerian"
site_description = "Valerian is GPU-accelerated deep-sky image processing for Windows, macOS and Linux: calibrate, register, stack, plate solve, remove gradients, colour calibrate, stretch and remove stars."
site_author = "Laurence Horrocks-Barlow"
site_url = "https://qisback.github.io/valerian/"
docs_dir = "docs/book/src"
site_dir = "site"
use_directory_urls = true
repo_url = "https://github.com/qisback/valerian"
repo_name = "qisback/valerian"
copyright = "Copyright (C) 2026 Laurence Horrocks-Barlow. Valerian is free software under the GPL-3.0-or-later licence, with the additional terms in ADDITIONAL-TERMS.md."
extra_css = ["stylesheets/extra.css", "stylesheets/download-widget.css"]
extra_javascript = ["javascripts/download-widget.js"]
exclude_docs = """
"""

