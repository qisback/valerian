#
# Flatpak manifest for Valerian. UNTESTED: nothing in CI builds it (no Flatpak builder on the
# runners), and it is not published to a remote yet. It repackages the release tarball, so
# nothing is compiled here. The url and sha256 are the v0.4.0 release; for a newer release update both. To test:
# try:  flatpak-builder --user --install --force-clean build packaging/flatpak/casa.discworld.valerian.yml
# The repository is private, so flatpak-builder cannot fetch the url: download the tarball
# and use `type: archive` with `path:` instead of `url:`.
# The app id matches the AppStream id; the desktop file and icon are renamed to it, which
# Flatpak requires.
app-id: casa.discworld.valerian
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: valerian-gui
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # Subframes live anywhere in the home folder and stacks are written beside them.
  - --filesystem=home
modules:
  - name: valerian
    buildsystem: simple
    build-commands:
      - install -Dm755 valerian valerian-gui -t /app/bin
      - install -Dm644 share/applications/valerian.desktop /app/share/applications/casa.discworld.valerian.desktop
      - sed -i 's/^Icon=valerian$/Icon=casa.discworld.valerian/' /app/share/applications/casa.discworld.valerian.desktop
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 share/icons/hicolor/${s}x${s}/apps/valerian.png /app/share/icons/hicolor/${s}x${s}/apps/casa.discworld.valerian.png; done
      - install -Dm644 LICENSE ADDITIONAL-TERMS.md LOGO-LICENCE.md THIRD-PARTY-LICENSES.txt -t /app/share/doc/valerian
    sources:
      - type: archive
        # v0.4.0 release asset; sha256 from the release SHA256SUMS.
        url: https://github.com/qisback/valerian/releases/download/v0.4.0/valerian-0.4.0-x86_64-unknown-linux-gnu.tar.gz
        sha256: "ef3a8df6f8ff7721c9a16d46a5715a92e883315314c70cba847198a1a372735f"
