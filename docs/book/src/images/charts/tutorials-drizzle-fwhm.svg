<svg xmlns="http://www.w3.org/2000/svg" width="480" height="224" viewBox="0 0 480 224" role="img" aria-labelledby="t d">
<title id="t">Star FWHM by drizzle setting</title><desc id="d">Horizontal bars of star FWHM in original pixels. Defaults 2.52, pixfrac 1.0 2.63, scale 3 2.45, no-reject 2.46.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="223" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Star FWHM by drizzle setting</text>
<text x="158.0" y="62.5" class="ink" text-anchor="end">Defaults (scale 2,</text>
<text x="158.0" y="77.5" class="ink" text-anchor="end">pixfrac 0.6)</text>
<rect x="166.0" y="57.0" width="220.1" height="18" fill="#0072B2"/>
<text x="390.1" y="73.0" class="sub" text-anchor="start" style="font-size:11px">2.52</text>
<text x="158.0" y="102.0" class="ink" text-anchor="end">--pixfrac 1.0</text>
<rect x="166.0" y="89.0" width="229.7" height="18" fill="#0072B2"/>
<text x="399.7" y="105.0" class="sub" text-anchor="start" style="font-size:11px">2.63</text>
<text x="158.0" y="130.0" class="ink" text-anchor="end">--scale 3</text>
<rect x="166.0" y="117.0" width="214.0" height="18" fill="#0072B2"/>
<text x="384.0" y="133.0" class="sub" text-anchor="start" style="font-size:11px">2.45</text>
<text x="158.0" y="158.0" class="ink" text-anchor="end">--no-reject</text>
<rect x="166.0" y="145.0" width="214.8" height="18" fill="#0072B2"/>
<text x="384.8" y="161.0" class="sub" text-anchor="start" style="font-size:11px">2.46</text>
<line class="grid" x1="166.0" x2="166.0" y1="46" y2="168"/>
<text x="166.0" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="209.7" x2="209.7" y1="46" y2="168"/>
<text x="209.7" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">0.5</text>
<line class="grid" x1="253.3" x2="253.3" y1="46" y2="168"/>
<text x="253.3" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">1</text>
<line class="grid" x1="297.0" x2="297.0" y1="46" y2="168"/>
<text x="297.0" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">1.5</text>
<line class="grid" x1="340.7" x2="340.7" y1="46" y2="168"/>
<text x="340.7" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">2</text>
<line class="grid" x1="384.3" x2="384.3" y1="46" y2="168"/>
<text x="384.3" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">2.5</text>
<line class="grid" x1="428.0" x2="428.0" y1="46" y2="168"/>
<text x="428.0" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">3</text>
<line class="axis" x1="166" x2="166" y1="46" y2="168"/>
<text x="297.0" y="202.0" class="sub" text-anchor="middle">Star FWHM, original pixels (lower is sharper)</text>
</svg>
