<svg xmlns="http://www.w3.org/2000/svg" width="480" height="450" viewBox="0 0 480 450" role="img" aria-labelledby="t d">
<title id="t">Valerian noise against reference</title><desc id="d">Scatter of Valerian noise in ADU against reference noise on equal log axes. Pairs: 46.84 against 46.61, 33.4 against 33.1, 23.39 against 23.24, 16.15 against 15.97, 11.91 against 11.54, 8.79 against 8.26.</desc>
