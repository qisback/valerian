<svg xmlns="http://www.w3.org/2000/svg" width="480" height="309" viewBox="0 0 480 309" role="img" aria-labelledby="t d">
<title id="t">Time to remove the stars</title><desc id="d">Bars of seconds. H-alpha stack 4.3, Seestar colour stack 0.9.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="308" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Time to remove the stars</text>
<line class="grid" x1="58" x2="468" y1="246.0" y2="246.0"/>
<text x="52.0" y="250.0" class="sub" text-anchor="end" style="font-size:11px">0</text>
<line class="grid" x1="58" x2="468" y1="208.0" y2="208.0"/>
<text x="52.0" y="212.0" class="sub" text-anchor="end" style="font-size:11px">1</text>
<line class="grid" x1="58" x2="468" y1="170.0" y2="170.0"/>
<text x="52.0" y="174.0" class="sub" text-anchor="end" style="font-size:11px">2</text>
<line class="grid" x1="58" x2="468" y1="132.0" y2="132.0"/>
<text x="52.0" y="136.0" class="sub" text-anchor="end" style="font-size:11px">3</text>
<line class="grid" x1="58" x2="468" y1="94.0" y2="94.0"/>
<text x="52.0" y="98.0" class="sub" text-anchor="end" style="font-size:11px">4</text>
<line class="grid" x1="58" x2="468" y1="56.0" y2="56.0"/>
<text x="52.0" y="60.0" class="sub" text-anchor="end" style="font-size:11px">5</text>
<rect x="143.5" y="82.6" width="33.0" height="163.4" fill="#0072B2"/>
<text x="160.0" y="79.6" class="sub" text-anchor="middle" style="font-size:11px">4.3</text>
<text x="160.5" y="262.0" class="ink" text-anchor="middle">H-alpha, 4656 x 3520</text>
<rect x="348.5" y="211.8" width="33.0" height="34.2" fill="#0072B2"/>
<text x="365.0" y="208.8" class="sub" text-anchor="middle" style="font-size:11px">0.9</text>
<text x="365.5" y="262.0" class="ink" text-anchor="middle">Seestar, 1080 x 1920</text>
<line class="axis" x1="58" x2="468" y1="246.0" y2="246.0"/>
<line class="axis" x1="58" x2="58" y1="56" y2="246"/>
<text x="240.0" y="287.0" class="sub" text-anchor="middle">Time, seconds (lower is better)</text>
</svg>
