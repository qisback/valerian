<svg xmlns="http://www.w3.org/2000/svg" width="480" height="206" viewBox="0 0 480 206" role="img" aria-labelledby="t d">
<title id="t">Memory to build the masters</title><desc id="d">Horizontal grouped bars of memory in GiB. Bias master of 70 frames: 5.8 with every frame loaded, 0.53 streamed with the default budget. Darks, dark flats, flats and one light: 4.8 before, 1.4 now.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="205" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Memory to build the masters</text>
<rect x="16" y="38" width="12" height="12" rx="2" fill="#0072B2"/>
<text x="34.0" y="49.0" class="ink" text-anchor="start">Every frame loaded</text>
<rect x="178.0" y="38" width="12" height="12" rx="2" fill="#D55E00"/>
<text x="196.0" y="49.0" class="ink" text-anchor="start">Streamed (default budget)</text>
<text x="158.0" y="86.5" class="ink" text-anchor="end">Bias master, 70</text>
<text x="158.0" y="101.5" class="ink" text-anchor="end">frames</text>
<rect x="166.0" y="75.0" width="253.3" height="14" fill="#0072B2"/>
<text x="423.3" y="87.0" class="sub" text-anchor="start" style="font-size:11px">5.80</text>
<rect x="166.0" y="91.0" width="23.1" height="14" fill="#D55E00"/>
<text x="193.1" y="103.0" class="sub" text-anchor="start" style="font-size:11px">0.53</text>
<text x="158.0" y="126.5" class="ink" text-anchor="end">Darks, dark flats,</text>
<text x="158.0" y="141.5" class="ink" text-anchor="end">flats, one light</text>
<rect x="166.0" y="115.0" width="209.6" height="14" fill="#0072B2"/>
<text x="379.6" y="127.0" class="sub" text-anchor="start" style="font-size:11px">4.80</text>
<rect x="166.0" y="131.0" width="61.1" height="14" fill="#D55E00"/>
<text x="231.1" y="143.0" class="sub" text-anchor="start" style="font-size:11px">1.40</text>
<line class="grid" x1="166.0" x2="166.0" y1="68" y2="150"/>
<text x="166.0" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="209.7" x2="209.7" y1="68" y2="150"/>
<text x="209.7" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">1</text>
<line class="grid" x1="253.3" x2="253.3" y1="68" y2="150"/>
<text x="253.3" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">2</text>
<line class="grid" x1="297.0" x2="297.0" y1="68" y2="150"/>
<text x="297.0" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">3</text>
<line class="grid" x1="340.7" x2="340.7" y1="68" y2="150"/>
<text x="340.7" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">4</text>
<line class="grid" x1="384.3" x2="384.3" y1="68" y2="150"/>
<text x="384.3" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">5</text>
<line class="grid" x1="428.0" x2="428.0" y1="68" y2="150"/>
<text x="428.0" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">6</text>
<line class="axis" x1="166" x2="166" y1="68" y2="150"/>
<text x="297.0" y="184.0" class="sub" text-anchor="middle">Memory, GiB (lower is better)</text>
</svg>
