<text x="52.0" y="129.5" class="sub" text-anchor="end" style="font-size:11px">60</text>
<line class="grid" x1="58" x2="468" y1="78.0" y2="78.0"/>
<text x="52.0" y="82.0" class="sub" text-anchor="end" style="font-size:11px">80</text>
