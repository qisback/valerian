<text x="52.0" y="224.5" class="sub" text-anchor="end" style="font-size:11px">20</text>
<line class="grid" x1="58" x2="468" y1="173.0" y2="173.0"/>
<text x="52.0" y="177.0" class="sub" text-anchor="end" style="font-size:11px">40</text>
