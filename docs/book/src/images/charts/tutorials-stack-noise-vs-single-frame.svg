<rect x="126.3" y="238.3" width="33.0" height="29.7" fill="#D55E00"/>
<text x="142.8" y="235.3" class="sub" text-anchor="middle" style="font-size:11px">12.49</text>
<text x="126.3" y="284.0" class="ink" text-anchor="middle">Red</text>
<rect x="229.0" y="160.2" width="33.0" height="107.8" fill="#0072B2"/>
<text x="245.5" y="157.2" class="sub" text-anchor="middle" style="font-size:11px">45.40</text>
<rect x="263.0" y="250.3" width="33.0" height="17.7" fill="#D55E00"/>
