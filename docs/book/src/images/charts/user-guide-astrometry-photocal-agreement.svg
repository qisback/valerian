<svg xmlns="http://www.w3.org/2000/svg" width="480" height="206" viewBox="0 0 480 206" role="img" aria-labelledby="t d">
<title id="t">Colour fit against photutils</title><desc id="d">Horizontal grouped bars of colour differences in magnitudes. Red against green: rms 0.0005, largest 0.0027. Blue against green: rms 0.0016, largest 0.0072.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="205" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Colour fit against photutils</text>
<rect x="16" y="38" width="12" height="12" rx="2" fill="#0072B2"/>
<text x="34.0" y="49.0" class="ink" text-anchor="start">rms</text>
<rect x="73.0" y="38" width="12" height="12" rx="2" fill="#D55E00"/>
<text x="91.0" y="49.0" class="ink" text-anchor="start">Largest</text>
<text x="158.0" y="94.0" class="ink" text-anchor="end">Red against green</text>
<rect x="166.0" y="75.0" width="16.4" height="14" fill="#0072B2"/>
<text x="186.4" y="87.0" class="sub" text-anchor="start" style="font-size:11px">0.0005</text>
<rect x="166.0" y="91.0" width="88.4" height="14" fill="#D55E00"/>
<text x="258.4" y="103.0" class="sub" text-anchor="start" style="font-size:11px">0.0027</text>
<text x="158.0" y="134.0" class="ink" text-anchor="end">Blue against green</text>
<rect x="166.0" y="115.0" width="52.4" height="14" fill="#0072B2"/>
<text x="222.4" y="127.0" class="sub" text-anchor="start" style="font-size:11px">0.0016</text>
<rect x="166.0" y="131.0" width="235.8" height="14" fill="#D55E00"/>
<text x="405.8" y="143.0" class="sub" text-anchor="start" style="font-size:11px">0.0072</text>
<line class="grid" x1="166.0" x2="166.0" y1="68" y2="150"/>
<text x="166.0" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="231.5" x2="231.5" y1="68" y2="150"/>
<text x="231.5" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">0.002</text>
<line class="grid" x1="297.0" x2="297.0" y1="68" y2="150"/>
<text x="297.0" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">0.004</text>
<line class="grid" x1="362.5" x2="362.5" y1="68" y2="150"/>
<text x="362.5" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">0.006</text>
<line class="grid" x1="428.0" x2="428.0" y1="68" y2="150"/>
<text x="428.0" y="166.0" class="sub" text-anchor="middle" style="font-size:11px">0.008</text>
<line class="axis" x1="166" x2="166" y1="68" y2="150"/>
<text x="297.0" y="184.0" class="sub" text-anchor="middle">Difference in colour, magnitudes (lower is closer)</text>
</svg>
