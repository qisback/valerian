<svg xmlns="http://www.w3.org/2000/svg" width="480" height="344" viewBox="0 0 480 344" role="img" aria-labelledby="t d">
<title id="t">Red noise by stacking choice</title><desc id="d">Horizontal bars of red noise in ADU. Defaults 12.49, equal weights 16.2, no rejection 13.01, sigma 12.43, minmax 12.86, no normalisation 12.87, linear fit 2 and 2 15.05, plain average 16.11.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="343" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Red noise by stacking choice</text>
<text x="158.0" y="66.0" class="ink" text-anchor="end">Defaults</text>
<rect x="166.0" y="53.0" width="163.6" height="18" fill="#0072B2"/>
<text x="333.6" y="69.0" class="sub" text-anchor="start" style="font-size:11px">12.49</text>
<text x="158.0" y="94.0" class="ink" text-anchor="end">--weights equal</text>
<rect x="166.0" y="81.0" width="212.2" height="18" fill="#0072B2"/>
<text x="382.2" y="97.0" class="sub" text-anchor="start" style="font-size:11px">16.20</text>
<text x="158.0" y="122.0" class="ink" text-anchor="end">--rejection none</text>
<rect x="166.0" y="109.0" width="170.4" height="18" fill="#0072B2"/>
<text x="340.4" y="125.0" class="sub" text-anchor="start" style="font-size:11px">13.01</text>
<text x="158.0" y="150.0" class="ink" text-anchor="end">--rejection sigma</text>
<rect x="166.0" y="137.0" width="162.8" height="18" fill="#0072B2"/>
<text x="332.8" y="153.0" class="sub" text-anchor="start" style="font-size:11px">12.43</text>
<text x="158.0" y="178.0" class="ink" text-anchor="end">--rejection minmax</text>
<rect x="166.0" y="165.0" width="168.5" height="18" fill="#0072B2"/>
<text x="338.5" y="181.0" class="sub" text-anchor="start" style="font-size:11px">12.86</text>
<text x="158.0" y="206.0" class="ink" text-anchor="end">--normalisation none</text>
<rect x="166.0" y="193.0" width="168.6" height="18" fill="#0072B2"/>
<text x="338.6" y="209.0" class="sub" text-anchor="start" style="font-size:11px">12.87</text>
<text x="158.0" y="230.5" class="ink" text-anchor="end">linear-fit --low 2</text>
<text x="158.0" y="245.5" class="ink" text-anchor="end">--high 2</text>
<rect x="166.0" y="225.0" width="197.2" height="18" fill="#0072B2"/>
<text x="367.2" y="241.0" class="sub" text-anchor="start" style="font-size:11px">15.05</text>
<text x="158.0" y="266.5" class="ink" text-anchor="end">plain average (all</text>
<text x="158.0" y="281.5" class="ink" text-anchor="end">three off)</text>
<rect x="166.0" y="261.0" width="211.0" height="18" fill="#0072B2"/>
<text x="381.0" y="277.0" class="sub" text-anchor="start" style="font-size:11px">16.11</text>
<line class="grid" x1="166.0" x2="166.0" y1="46" y2="288"/>
<text x="166.0" y="304.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="231.5" x2="231.5" y1="46" y2="288"/>
<text x="231.5" y="304.0" class="sub" text-anchor="middle" style="font-size:11px">5</text>
<line class="grid" x1="297.0" x2="297.0" y1="46" y2="288"/>
<text x="297.0" y="304.0" class="sub" text-anchor="middle" style="font-size:11px">10</text>
<line class="grid" x1="362.5" x2="362.5" y1="46" y2="288"/>
<text x="362.5" y="304.0" class="sub" text-anchor="middle" style="font-size:11px">15</text>
<line class="grid" x1="428.0" x2="428.0" y1="46" y2="288"/>
<text x="428.0" y="304.0" class="sub" text-anchor="middle" style="font-size:11px">20</text>
<line class="axis" x1="166" x2="166" y1="46" y2="288"/>
<text x="297.0" y="322.0" class="sub" text-anchor="middle">Noise, plane 0 (red), ADU (lower is cleaner)</text>
</svg>
