<svg xmlns="http://www.w3.org/2000/svg" width="480" height="331" viewBox="0 0 480 331" role="img" aria-labelledby="t d">
<title id="t">Hinted against blind solve time</title><desc id="d">Grouped bars of seconds on a log axis. H-alpha stack: hinted 0.65, blind 7.1. Seestar colour stack: hinted 0.12, blind 11.3.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="330" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Hinted against blind solve time</text>
<rect x="16" y="38" width="12" height="12" rx="2" fill="#0072B2"/>
<text x="34.0" y="49.0" class="ink" text-anchor="start">Hinted</text>
<rect x="94.0" y="38" width="12" height="12" rx="2" fill="#D55E00"/>
<text x="112.0" y="49.0" class="ink" text-anchor="start">Blind</text>
<line class="grid" x1="58" x2="468" y1="268.0" y2="268.0"/>
<text x="52.0" y="272.0" class="sub" text-anchor="end" style="font-size:11px">0.1</text>
<line class="grid" x1="58" x2="468" y1="204.7" y2="204.7"/>
<text x="52.0" y="208.7" class="sub" text-anchor="end" style="font-size:11px">1</text>
<line class="grid" x1="58" x2="468" y1="141.3" y2="141.3"/>
<text x="52.0" y="145.3" class="sub" text-anchor="end" style="font-size:11px">10</text>
<line class="grid" x1="58" x2="468" y1="78.0" y2="78.0"/>
<text x="52.0" y="82.0" class="sub" text-anchor="end" style="font-size:11px">100</text>
<rect x="126.5" y="216.5" width="33.0" height="51.5" fill="#0072B2"/>
<text x="143.0" y="213.5" class="sub" text-anchor="middle" style="font-size:11px">0.65</text>
<rect x="160.5" y="150.8" width="33.0" height="117.2" fill="#D55E00"/>
<text x="177.0" y="147.8" class="sub" text-anchor="middle" style="font-size:11px">7.10</text>
<text x="160.5" y="284.0" class="ink" text-anchor="middle">H-alpha stack, 4656 x 3520</text>
<rect x="331.5" y="263.0" width="33.0" height="5.0" fill="#0072B2"/>
<text x="348.0" y="260.0" class="sub" text-anchor="middle" style="font-size:11px">0.12</text>
<rect x="365.5" y="138.0" width="33.0" height="130.0" fill="#D55E00"/>
<text x="382.0" y="135.0" class="sub" text-anchor="middle" style="font-size:11px">11.30</text>
<text x="365.5" y="284.0" class="ink" text-anchor="middle">Seestar stack, 1080 x 1920</text>
<line class="axis" x1="58" x2="468" y1="268.0" y2="268.0"/>
<line class="axis" x1="58" x2="58" y1="78" y2="268"/>
<text x="240.0" y="309.0" class="sub" text-anchor="middle">Solve time, seconds (lower is better), log scale</text>
</svg>
