<svg xmlns="http://www.w3.org/2000/svg" width="480" height="366" viewBox="0 0 480 366" role="img" aria-labelledby="t d">
<title id="t">Time of each stage, CPU against GPU</title><desc id="d">Horizontal grouped bars of milliseconds per stage for CPU and GPU. Calibrate 39 and 91, warp 69 and 101, sigma-clip combine 356 and 480, winsorised combine 672 and 535, linear-fit combine 479 and 482, stack plane 1658 and 576.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="365" rx="8"/>
