<svg xmlns="http://www.w3.org/2000/svg" width="480" height="224" viewBox="0 0 480 224" role="img" aria-labelledby="t d">
<title id="t">Peak memory of a 184-frame stack</title><desc id="d">Horizontal bars of peak memory in MiB. Memory 1024: 1164. Memory 4096: 1865. Memory 16384: 5346. Science report: 8966.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="223" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Peak memory of a 184-frame stack</text>
<text x="158.0" y="66.0" class="ink" text-anchor="end">--memory 1024</text>
<rect x="166.0" y="53.0" width="30.5" height="18" fill="#0072B2"/>
<text x="200.5" y="69.0" class="sub" text-anchor="start" style="font-size:11px">1164</text>
<text x="158.0" y="90.5" class="ink" text-anchor="end">--memory 4096</text>
<text x="158.0" y="105.5" class="ink" text-anchor="end">(default)</text>
<rect x="166.0" y="85.0" width="48.9" height="18" fill="#0072B2"/>
<text x="218.9" y="101.0" class="sub" text-anchor="start" style="font-size:11px">1865</text>
<text x="158.0" y="130.0" class="ink" text-anchor="end">--memory 16384</text>
<rect x="166.0" y="117.0" width="140.1" height="18" fill="#0072B2"/>
<text x="310.1" y="133.0" class="sub" text-anchor="start" style="font-size:11px">5346</text>
<text x="158.0" y="158.0" class="ink" text-anchor="end">--science-report</text>
<rect x="166.0" y="145.0" width="234.9" height="18" fill="#0072B2"/>
<text x="404.9" y="161.0" class="sub" text-anchor="start" style="font-size:11px">8966</text>
<line class="grid" x1="166.0" x2="166.0" y1="46" y2="168"/>
<text x="166.0" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="218.4" x2="218.4" y1="46" y2="168"/>
<text x="218.4" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">2000</text>
<line class="grid" x1="270.8" x2="270.8" y1="46" y2="168"/>
<text x="270.8" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">4000</text>
<line class="grid" x1="323.2" x2="323.2" y1="46" y2="168"/>
<text x="323.2" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">6000</text>
<line class="grid" x1="375.6" x2="375.6" y1="46" y2="168"/>
<text x="375.6" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">8000</text>
<line class="grid" x1="428.0" x2="428.0" y1="46" y2="168"/>
<text x="428.0" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">10000</text>
<line class="axis" x1="166" x2="166" y1="46" y2="168"/>
<text x="297.0" y="202.0" class="sub" text-anchor="middle">Peak memory, MiB (lower is smaller)</text>
</svg>
