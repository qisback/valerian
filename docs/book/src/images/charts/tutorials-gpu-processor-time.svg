<text x="161.0" y="49.0" class="ink" text-anchor="start">--backend gpu</text>
<line class="grid" x1="58" x2="468" y1="268.0" y2="268.0"/>
<text x="52.0" y="272.0" class="sub" text-anchor="end" style="font-size:11px">0</text>
<line class="grid" x1="58" x2="468" y1="220.5" y2="220.5"/>
<text x="52.0" y="224.5" class="sub" text-anchor="end" style="font-size:11px">20</text>
<line class="grid" x1="58" x2="468" y1="173.0" y2="173.0"/>
<text x="52.0" y="177.0" class="sub" text-anchor="end" style="font-size:11px">40</text>
<line class="grid" x1="58" x2="468" y1="125.5" y2="125.5"/>
<text x="52.0" y="129.5" class="sub" text-anchor="end" style="font-size:11px">60</text>
<line class="grid" x1="58" x2="468" y1="78.0" y2="78.0"/>
<text x="52.0" y="82.0" class="sub" text-anchor="end" style="font-size:11px">80</text>
<rect x="92.3" y="98.0" width="33.0" height="170.0" fill="#0072B2"/>
<text x="108.8" y="95.0" class="sub" text-anchor="middle" style="font-size:11px">71.6</text>
<rect x="126.3" y="207.0" width="33.0" height="61.0" fill="#D55E00"/>
<text x="142.8" y="204.0" class="sub" text-anchor="middle" style="font-size:11px">25.7</text>
<text x="126.3" y="284.0" class="ink" text-anchor="middle">Run 1</text>
<rect x="229.0" y="96.3" width="33.0" height="171.7" fill="#0072B2"/>
<text x="245.5" y="93.3" class="sub" text-anchor="middle" style="font-size:11px">72.3</text>
<rect x="263.0" y="207.0" width="33.0" height="61.0" fill="#D55E00"/>
