<text x="382.2" y="93.0" class="sub" text-anchor="middle" style="font-size:11px">72.4</text>
<rect x="399.7" y="205.1" width="33.0" height="62.9" fill="#D55E00"/>
<text x="416.2" y="202.1" class="sub" text-anchor="middle" style="font-size:11px">26.5</text>
