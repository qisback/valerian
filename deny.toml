[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained-crate notices only, all transitive via eframe's accesskit (Linux
# AT-SPI). Dropping the feature loses screen-reader support. Re-check on every
# eframe bump.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; via accesskit (Linux AT-SPI)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; via accesskit (Linux AT-SPI)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; via accesskit (Linux AT-SPI)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; via plotters/ab_glyph, which only draws text with the IBM Plex fonts embedded in the repository, never a font from outside. Re-check on every plotters bump" },
]

[licenses]
version = 2
# GPL-3.0-or-later compatible only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Helia's crates, pinned by tag in the workspace manifest.
allow-git = ["https://github.com/qisback/helia.git"]
